<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Dark Midnight Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1f0b3b" stop-opacity="1" />
      <stop offset="65%" stop-color="#0b0416" stop-opacity="1" />
      <stop offset="100%" stop-color="#05010a" stop-opacity="1" />
    </radialGradient>

    <!-- 3D Left Curly Brace Gradient (Electric Cyan to Royal Blue) -->
    <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>

    <!-- 3D Right Curly Brace Gradient (Neon Magenta to Deep Purple) -->
    <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="50%" stop-color="#D500F9" />
      <stop offset="100%" stop-color="#651FFF" />
    </linearGradient>

    <!-- 3D Depth Extrusion Gradients -->
    <linearGradient id="extLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001c59" />
      <stop offset="100%" stop-color="#000924" />
    </linearGradient>
    
    <linearGradient id="extRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56006e" />
      <stop offset="100%" stop-color="#19002e" />
    </linearGradient>

    <!-- Glow & Neon Lighting Filters -->
    <filter id="glowLeft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#00E5FF" flood-opacity="0.65" />
    </filter>
    <filter id="glowRight" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#D500F9" flood-opacity="0.65" />
    </filter>
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#00E5FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Premium Rounded App Badge Tile -->
  <rect width="472" height="472" x="20" y="20" rx="124" ry="124" fill="url(#bgGlow)" stroke="url(#gradRight)" stroke-width="7" stroke-opacity="0.5" filter="url(#tileShadow)" />

  <!-- 3D Extrusion Layer for Left Brace { -->
  <text x="180" y="355" font-family="'Segoe UI', 'Inter', 'Roboto', 'Montserrat', -apple-system, sans-serif" font-size="320" font-weight="900" text-anchor="middle" fill="url(#extLeft)" transform="translate(12, 14)">{</text>

  <!-- 3D Left Curly Brace { -->
  <text x="180" y="355" font-family="'Segoe UI', 'Inter', 'Roboto', 'Montserrat', -apple-system, sans-serif" font-size="320" font-weight="900" text-anchor="middle" fill="url(#gradLeft)" filter="url(#glowLeft)">{</text>

  <!-- 3D Extrusion Layer for Right Brace } -->
  <text x="332" y="355" font-family="'Segoe UI', 'Inter', 'Roboto', 'Montserrat', -apple-system, sans-serif" font-size="320" font-weight="900" text-anchor="middle" fill="url(#extRight)" transform="translate(-12, 14)">}</text>

  <!-- 3D Right Curly Brace } -->
  <text x="332" y="355" font-family="'Segoe UI', 'Inter', 'Roboto', 'Montserrat', -apple-system, sans-serif" font-size="320" font-weight="900" text-anchor="middle" fill="url(#gradRight)" filter="url(#glowRight)">}</text>

  <!-- Center Illuminated AI Diamond Crystal -->
  <polygon points="256,236 272,256 256,276 240,256" fill="#ffffff" filter="url(#glowLeft)" opacity="0.95" />
  
  <!-- Ambient Floating Tech Spheres -->
  <circle cx="256" cy="115" r="11" fill="#00FFFF" filter="url(#glowLeft)" />
  <circle cx="256" cy="397" r="11" fill="#D500F9" filter="url(#glowRight)" />
</svg>